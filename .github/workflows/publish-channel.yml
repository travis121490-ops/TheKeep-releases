name: Publish verified channel
run-name: Publish verified source run ${{ inputs.sourceRun }}
on:
  workflow_dispatch:
    inputs:
      sourceRun:
        description: Derived by the private Release The Keep workflow; no owner transcription
        required: true
        type: string
      verifyAccessOnly:
        description: Verify protected cross-repository access without artifacts or deployment
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: official-channel
  cancel-in-progress: false
jobs:
  publish:
    if: ${{ !inputs.verifyAccessOnly && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require deliberate owner preparation on canonical main
        env:
          GH_TOKEN: ${{ secrets.KEEP_SOURCE_READ_TOKEN }}
          SOURCE_RUN: ${{ inputs.sourceRun }}
        run: |
          set -eu
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/travis121490-ops/TheKeep/actions/runs/$SOURCE_RUN" > source-run.json
          gh api "repos/travis121490-ops/TheKeep/actions/runs/$SOURCE_RUN/jobs" > source-jobs.json
          python validate_channel.py --run source-run.json --jobs source-jobs.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-channel
          repository: travis121490-ops/TheKeep
          run-id: ${{ inputs.sourceRun }}
          github-token: ${{ secrets.KEEP_SOURCE_READ_TOKEN }}
          path: incoming
      - name: Check immutable draft and verified static bytes
        env:
          GH_TOKEN: ${{ secrets.KEEP_SOURCE_READ_TOKEN }}
        run: |
          set -eu
          code=$(python -c 'import json; print(int(json.load(open("incoming/release-evidence.json"))["identity"]["code"]))')
          gh api "repos/travis121490-ops/TheKeep/releases/tags/keep-$code" > source-release.json
          python validate_channel.py --run source-run.json --jobs source-jobs.json --incoming incoming --draft source-release.json --out channel
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: channel
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deploy

  verify-access:
    if: ${{ inputs.verifyAccessOnly && github.ref == 'refs/heads/main' && github.actor == github.repository_owner && github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: github-pages
    permissions:
      contents: read
    steps:
      - name: Verify protected private-source Actions and Contents reads
        env:
          GH_TOKEN: ${{ secrets.KEEP_SOURCE_READ_TOKEN }}
          SOURCE_RUN: ${{ inputs.sourceRun }}
        run: |
          set -eu
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || exit 1
          gh api "repos/travis121490-ops/TheKeep/actions/runs/$SOURCE_RUN" --silent
          gh api "repos/travis121490-ops/TheKeep/actions/runs/$SOURCE_RUN/jobs" --silent
          gh api "repos/travis121490-ops/TheKeep/contents/README.md" --silent
          echo 'PASS: protected source Actions/Contents reads; publication job skipped'